services:
  - type: web
    name: production-system-api
    env: java
    buildCommand: mvn clean package -DskipTests
    startCommand: java -jar target/production-system-0.0.1-SNAPSHOT.jar
    envVars:
      - key: JAVA_VERSION
        value: 21
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
